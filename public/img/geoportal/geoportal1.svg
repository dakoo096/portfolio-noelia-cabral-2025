<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-geo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent-geo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow-geo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-geo)" />

  <!-- GIS map grid & vector contours simulation -->
  <circle cx="400" cy="180" r="160" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />
  <circle cx="400" cy="180" r="110" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="400" cy="180" r="60" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />

  <!-- Map marker pin -->
  <path d="M400 130 C383.431 130 370 143.431 370 160 C370 182.5 400 215 400 215 C400 215 430 182.5 430 160 C430 143.431 416.569 130 400 130 Z" fill="url(#accent-geo)" filter="url(#glow-geo)" />
  <circle cx="400" cy="160" r="10" fill="#0f172a" />

  <!-- Layer panel preview mockup -->
  <rect x="180" y="80" width="130" height="170" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  <rect x="195" y="95" width="80" height="10" rx="3" fill="#38bdf8" />
  <rect x="195" y="115" width="100" height="8" rx="2" fill="rgba(255,255,255,0.4)" />
  <rect x="195" y="133" width="90" height="8" rx="2" fill="rgba(255,255,255,0.4)" />
  <rect x="195" y="151" width="70" height="8" rx="2" fill="rgba(255,255,255,0.4)" />
  <rect x="195" y="169" width="85" height="8" rx="2" fill="rgba(255,255,255,0.4)" />

  <!-- GIS WMS/WFS layer lines -->
  <path d="M 280 220 Q 340 150, 400 180 T 520 140" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 310 250 Q 400 210, 480 230 T 550 190" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Badge -->
  <rect x="290" y="325" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="400" y="346" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">PLATAFORMA GIS (WMS/WFS)</text>

  <!-- Title & Subtitle -->
  <text x="400" y="390" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">GEOPORTAL</text>
  <text x="400" y="415" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="middle">Plataforma Web de Información Geográfica</text>
</svg>
