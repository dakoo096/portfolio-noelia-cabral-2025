<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mbta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>
    <linearGradient id="accent-mbta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f38cbe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow-mbta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-mbta)" />

  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="220" fill="#f38cbe" opacity="0.08" filter="url(#glow-mbta)" />
  <circle cx="100" cy="380" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow-mbta)" />

  <!-- Grid Pattern -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M160 0 V450 M320 0 V450 M480 0 V450 M640 0 V450" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Card graphic preview mockup -->
  <rect x="220" y="70" width="360" height="230" rx="16" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(243, 140, 190, 0.3)" stroke-width="2" />
  
  <!-- Header bar of mockup -->
  <rect x="220" y="70" width="360" height="36" rx="16" fill="rgba(15, 23, 42, 0.9)" />
  <circle cx="245" cy="88" r="5" fill="#ef4444" />
  <circle cx="260" cy="88" r="5" fill="#eab308" />
  <circle cx="275" cy="88" r="5" fill="#22c55e" />
  <rect x="310" y="82" width="180" height="12" rx="6" fill="rgba(255,255,255,0.15)" />

  <!-- Mockup content lines -->
  <rect x="250" y="125" width="140" height="14" rx="4" fill="url(#accent-mbta)" />
  <rect x="250" y="150" width="300" height="10" rx="3" fill="rgba(255,255,255,0.3)" />
  <rect x="250" y="170" width="260" height="10" rx="3" fill="rgba(255,255,255,0.2)" />

  <!-- Dashboard stats widgets -->
  <rect x="250" y="195" width="90" height="85" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" />
  <rect x="355" y="195" width="90" height="85" rx="8" fill="rgba(243, 140, 190, 0.2)" stroke="rgba(243, 140, 190, 0.4)" />
  <rect x="460" y="195" width="90" height="85" rx="8" fill="rgba(34, 197, 94, 0.2)" stroke="rgba(34, 197, 94, 0.4)" />

  <!-- Badge -->
  <rect x="290" y="325" width="220" height="32" rx="16" fill="rgba(243, 140, 190, 0.15)" stroke="#f38cbe" stroke-width="1.5" />
  <text x="400" y="346" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f38cbe" text-anchor="middle">SISTEMA GUBERNAMENTAL</text>

  <!-- Title & Subtitle -->
  <text x="400" y="390" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">MBTA</text>
  <text x="400" y="415" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#cbd5e1" text-anchor="middle">Gestión Administrativa y Nóminas Municipales</text>
</svg>
